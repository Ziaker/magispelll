name: Temporary Mago monster effect migration

on:
  push:
    branches: [overhaul/mago-monster-effect-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/mago-monster-effect-handler
      - name: Install dependencies
        run: npm ci
      - name: Move Mago monster effect handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const handlersPath = 'src/app/lib/monsterEffectHandlers.ts';
          const functionName = 'handleExecuteMagoMonsterEffect';
          const source = fs.readFileSync(enginePath, 'utf8');
          let handlers = fs.readFileSync(handlersPath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const oldImport = "import { handleActivateMonsterEffectSimple } from './monsterEffectHandlers';";
          const newImport = "import { handleActivateMonsterEffectSimple, handleExecuteMagoMonsterEffect } from './monsterEffectHandlers';";
          if (next.split(oldImport).length !== 2) throw new Error('monsterEffectHandlers import anchor not found exactly once');
          next = next.replace(oldImport, newImport);

          const statusImport = "import { applyStatus, removeStatusFromField } from './statusEffects';";
          const cardImport = "import { getEffectiveCardValue, isPlainNumeralCard } from './cardUtils';";
          if (handlers.includes(cardImport)) throw new Error('cardUtils import already present unexpectedly');
          if (handlers.split(statusImport).length !== 2) throw new Error('statusEffects import anchor not found exactly once');
          handlers = handlers.replace(statusImport, `${cardImport}\n${statusImport}`);
          handlers = handlers.replace(
            ' * O Mago continua em um fluxo dedicado; este módulo concentra o handler\n * compartilhado dos demais personagens sem depender de gameEngine.ts.',
            ' * Concentra todos os efeitos da Zona Monstro, inclusive a Ilusão Arcana\n * do Mago, sem depender de gameEngine.ts.'
          );
          handlers = handlers.trimEnd() + '\n\n' + snippet + '\n';

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(handlersPath, handlers);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Mago monster-effect diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: consolidate Mago monster effect handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/mago-monster-effect-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
