name: Temporary phase transition migration

on:
  push:
    branches: [overhaul/phase-transition-rules]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/phase-transition-rules
      - name: Extract pure phase transition rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('src/app/lib/gameEngine.ts')
          rules_path = Path('src/app/lib/phaseRules.ts')
          text = engine_path.read_text(encoding='utf-8')

          if rules_path.exists():
              raise SystemExit('phaseRules.ts already exists; refusing duplicate migration')

          rules_path.write_text("""/**
           * phaseRules.ts - regras puras de progressão entre fases.
           *
           * Este módulo decide somente a progressão estrutural do relógio do jogo:
           * draw -> strategy -> combat -> draw, alternância de firstToFlip e avanço
           * do contador de turnos. Efeitos de entrada/saída de fase (status, campo,
           * Monstro, Spotlight etc.) continuam coordenados pelo motor.
           */
          import type { Phase, PlayerNumber } from './gameTypes';

          export interface PhaseTransitionState {
            phase: Phase;
            firstToFlip: PlayerNumber;
            turn: number;
          }

          export function getNextPhaseTransition(state: PhaseTransitionState): PhaseTransitionState {
            if (state.phase === 'draw') {
              return { phase: 'strategy', firstToFlip: state.firstToFlip, turn: state.turn };
            }
            if (state.phase === 'strategy') {
              return { phase: 'combat', firstToFlip: state.firstToFlip, turn: state.turn };
            }
            return {
              phase: 'draw',
              firstToFlip: state.firstToFlip === 1 ? 2 : 1,
              turn: state.turn + 1,
            };
          }
          """, encoding='utf-8')

          import_anchor = "import { playerKeyOf, opponentKeyOf, opponentOf, characterOf } from './gameSelectors';\n"
          import_line = "import { getNextPhaseTransition } from './phaseRules';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('gameSelectors import anchor not found exactly once')
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_init = """function advancePhaseState(state: GameState): GameState {
            let newPhase: Phase;
            let newFirstToFlip = state.firstToFlip;
            let newTurn = state.turn;
            let log = state.log;"""
          new_init = """function advancePhaseState(state: GameState): GameState {
            const transition = getNextPhaseTransition(state);
            const newPhase = transition.phase;
            const newFirstToFlip = transition.firstToFlip;
            const newTurn = transition.turn;
            let log = state.log;"""
          if text.count(old_init) != 1:
              raise SystemExit('advancePhaseState initialization block not found exactly once')
          text = text.replace(old_init, new_init, 1)

          replacements = [
              ("""  if (state.phase === 'draw') {
              newPhase = 'strategy';
              log = appendLog""", """  if (state.phase === 'draw') {
              log = appendLog"""),
              ("""  } else if (state.phase === 'strategy') {
              newPhase = 'combat';
              newCombatLoneTower = computeLoneTowerForCombat(state);""", """  } else if (state.phase === 'strategy') {
              newCombatLoneTower = computeLoneTowerForCombat(state);"""),
              ("""  } else {
              newPhase = 'draw';
              newFirstToFlip = state.firstToFlip === 1 ? 2 : 1;
              newTurn = state.turn + 1;
              log = appendLog""", """  } else {
              log = appendLog"""),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('phase assignment block not found exactly once')
              text = text.replace(old, new, 1)

          engine_path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts src/app/lib/phaseRules.ts; then
            echo "No phase transition diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts src/app/lib/phaseRules.ts
          git commit -m "refactor: extract pure phase transition rule"
          git push origin HEAD:overhaul/phase-transition-rules
