name: Temporary Ace handler migration

on:
  push:
    branches: [overhaul/ace-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/ace-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract Ace handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/aceHandlers.ts';
          const functionName = 'handleTransformAce';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('aceHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          const block = source.slice(node.getFullStart(), node.end).trim().replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const glacialImport = "import { handlePayToUnfreeze } from './glacialHandlers';\n";
          const aceImport = "import { handleTransformAce } from './aceHandlers';\n";
          if (next.split(glacialImport).length !== 2) throw new Error('glacialHandlers import anchor not found exactly once');
          next = next.replace(glacialImport, glacialImport + aceImport);

          const aceTargetSpecifier = '  isValidAceTransformTarget,\n';
          if (next.split(aceTargetSpecifier).length !== 2) throw new Error('isValidAceTransformTarget import specifier not found exactly once');
          next = next.replace(aceTargetSpecifier, '');

          const header = [
            '/**',
            ' * aceHandlers.ts - transições de estado da transformação do Ás.',
            ' *',
            ' * A elegibilidade do alvo continua centralizada em cardUtils;',
            ' * este módulo apenas aplica a transformação aceita ao estado.',
            ' */',
            "import { getDisplayValue, getEffectiveCardValue, isValidAceTransformTarget } from './cardUtils';",
            "import { appendLog } from './gameLog';",
            "import { playerKeyOf } from './gameSelectors';",
            "import type { FieldSlot, GameState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + block + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Ace-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract Ace transform handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/ace-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
