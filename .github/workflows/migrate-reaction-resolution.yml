name: Temporary reaction resolution migration

on:
  push:
    branches: [overhaul/reaction-resolution-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/reaction-resolution-handler
      - name: Install dependencies
        run: npm ci
      - name: Move reaction resolution handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const reactionPath = 'src/app/lib/reactionHandlers.ts';
          const source = fs.readFileSync(enginePath, 'utf8');
          let reactions = fs.readFileSync(reactionPath, 'utf8');
          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const functionName = 'handleResolvePendingReaction';
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found as top-level function`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const reactionImport = "import { handleReactToMagic, maybeDeferForReaction } from './reactionHandlers';";
          const newReactionImport = "import { handleReactToMagic, handleResolvePendingReaction, maybeDeferForReaction } from './reactionHandlers';";
          if (next.split(reactionImport).length !== 2) throw new Error('reactionHandlers engine import anchor not found exactly once');
          next = next.replace(reactionImport, newReactionImport);

          const magicImport = "import { handleActivateSimpleMagic, handleExecuteMagic } from './magicHandlers';";
          if (!reactions.includes(magicImport)) {
            const actionImport = "import type { GameAction } from './gameActionTypes';";
            if (reactions.split(actionImport).length !== 2) throw new Error('reactionHandlers import anchor not found exactly once');
            reactions = reactions.replace(actionImport, `${actionImport}\n${magicImport}`);
          }

          reactions = reactions.replace(
            ' * A resolução da janela ainda fica junto das magias até os handlers J/Q/K\n * também saírem do reducer principal.\n',
            ' * A resolução da janela também vive aqui: quando o prazo expira, a ação\n * original é reexecutada pelos handlers de magia já modularizados.\n'
          );
          reactions = reactions.trimEnd() + '\n\n' + snippet + '\n';

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(reactionPath, reactions);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No reaction-resolution diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: move pending reaction resolution handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/reaction-resolution-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
