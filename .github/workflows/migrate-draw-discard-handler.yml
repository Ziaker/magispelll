name: Temporary draw discard handler migration

on:
  push:
    branches: [overhaul/draw-discard-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/draw-discard-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract discard handler into draw phase module
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const drawPath = 'src/app/lib/drawPhaseHandlers.ts';
          const functionName = 'handleDiscardCards';
          const source = fs.readFileSync(enginePath, 'utf8');
          let draw = fs.readFileSync(drawPath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          let block = source.slice(node.getFullStart(), node.end).trim();
          if (!block.includes(`function ${functionName}`)) throw new Error('unexpected handler source');
          block = block.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const engineImport = "import { handleDrawCards } from './drawPhaseHandlers';";
          const nextEngineImport = "import { handleDiscardCards, handleDrawCards } from './drawPhaseHandlers';";
          if (next.split(engineImport).length !== 2) throw new Error('drawPhaseHandlers engine import anchor not found exactly once');
          next = next.replace(engineImport, nextEngineImport);

          const deckImport = "import { ensureDeckHasCards } from './deckLifecycle';";
          const nextDeckImport = "import { ensureDeckHasCards, pushToDiscard } from './deckLifecycle';";
          if (draw.split(deckImport).length !== 2) throw new Error('deckLifecycle import anchor not found exactly once');
          draw = draw.replace(deckImport, nextDeckImport);

          const limitsImport = "import { getEffectiveDrawLimit } from './gameLimits';";
          const nextLimitsImport = "import { getEffectiveDiscardLimit, getEffectiveDrawLimit } from './gameLimits';";
          if (draw.split(limitsImport).length !== 2) throw new Error('gameLimits import anchor not found exactly once');
          draw = draw.replace(limitsImport, nextLimitsImport);

          draw = draw.trimEnd() + '\n\n' + block + '\n';
          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(drawPath, draw);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No discard-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract draw-phase discard handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/draw-discard-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
