name: Temporary game action type migration

on:
  push:
    branches: [overhaul/game-action-types]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/game-action-types
      - name: Install dependencies
        run: npm ci
      - name: Extract GameAction and MagicSelection with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/gameActionTypes.ts';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('gameActionTypes.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const wanted = new Map();
          for (const stmt of sf.statements) {
            if (ts.isInterfaceDeclaration(stmt) && stmt.name.text === 'MagicSelection') wanted.set('MagicSelection', stmt);
            if (ts.isTypeAliasDeclaration(stmt) && stmt.name.text === 'GameAction') wanted.set('GameAction', stmt);
          }
          for (const name of ['MagicSelection', 'GameAction']) {
            if (!wanted.has(name)) throw new Error(`${name} declaration not found`);
          }

          const blocks = {};
          const ranges = [];
          for (const [name, node] of wanted) {
            const start = node.getFullStart();
            const end = node.end;
            blocks[name] = source.slice(start, end).trim();
            ranges.push([start, end]);
          }

          let next = source;
          ranges.sort((a, b) => b[0] - a[0]);
          for (const [start, end] of ranges) next = next.slice(0, start) + next.slice(end);

          const importAnchor = "import type { LogEntry, LogEventType } from './gameLogTypes';\n";
          const importLine = "import type { GameAction, MagicSelection } from './gameActionTypes';\n";
          if ((next.match(new RegExp(importAnchor.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&'), 'g')) || []).length !== 1) {
            throw new Error('gameLogTypes import anchor not found exactly once');
          }
          next = next.replace(importAnchor, importAnchor + importLine);

          const exportAnchor = "export type { LogEntry, LogEventType } from './gameLogTypes';\n";
          const exportLine = "export type { GameAction, MagicSelection } from './gameActionTypes';\n";
          if (!next.includes(exportAnchor)) throw new Error('gameLogTypes export anchor not found');
          next = next.replace(exportAnchor, exportAnchor + exportLine);

          const header = [
            '/**',
            ' * gameActionTypes.ts - contrato tipado das ações aceitas pelo reducer.',
            ' *',
            ' * Mantém o shape das ações separado da implementação do motor para que',
            ' * UI, IA, action-space e ferramentas possam depender do protocolo sem',
            ' * usar gameEngine.ts como hub de tipos.',
            ' */',
            "import type { PlayerNumber } from './gameTypes';",
            "import type { CharacterId } from './characterRegistry';",
            "import type { MagicCardType } from './magicCards';",
            "import type { GameState } from './gameEngine';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.MagicSelection + '\n\n' + blocks.GameAction + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm run test:actions
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts src/app/lib/gameActionTypes.ts; then
            echo "No action type migration diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts src/app/lib/gameActionTypes.ts
          git commit -m "refactor: extract game action types from engine"
          git push origin HEAD:overhaul/game-action-types
