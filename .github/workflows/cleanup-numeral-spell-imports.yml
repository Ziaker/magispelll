name: Temporary numeral spell import cleanup

on:
  push:
    branches: [overhaul/numeral-spell-handlers]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/numeral-spell-handlers
      - name: Install dependencies
        run: npm ci
      - name: Clean numeral spell imports
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const path = 'src/app/lib/numeralSpellHandlers.ts';
          let source = fs.readFileSync(path, 'utf8');
          const marker = '// ---------------------------------------------------------------------------\n// Magia Numeral';
          const markerIndex = source.indexOf(marker);
          if (markerIndex < 0) throw new Error('Magia Numeral marker not found');
          const commentEnd = source.indexOf('*/') + 2;
          if (commentEnd < 2 || commentEnd >= markerIndex) throw new Error('module comment boundary not found');

          const imports = [
            "import { drawCards, type Card } from './cardUtils';",
            "import { pushToDiscard, ensureDeckHasAtLeast } from './deckLifecycle';",
            "import { fieldCards } from './fieldQueries';",
            "import { appendLog } from './gameLog';",
            "import { opponentKeyOf, opponentOf, playerKeyOf, characterOf } from './gameSelectors';",
            "import { emptyField } from './gameStateFactory';",
            "import type { FieldSlot, GameState, PlayerState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            "import { resolveMonsterCardAtTurnEnd } from './monsterLifecycle';",
            "import { canActivateNumeralSpell, formatNumeralRequirement, getMatchingNumeralCards, getNumeralSpellInfo } from './numeralSpells';",
            "import { advancePhaseState } from './phaseHandlers';",
            "import { applyStatus } from './statusEffects';",
          ].join('\n');

          source = source.slice(0, commentEnd) + '\n' + imports + '\n' + source.slice(markerIndex);
          fs.writeFileSync(path, source);
          NODE
      - name: Validate cleanup
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit cleanup
        run: |
          if git diff --quiet -- src/app/lib/numeralSpellHandlers.ts; then
            echo "No import cleanup diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/numeralSpellHandlers.ts
          git commit -m "refactor: trim numeral spell handler imports"
          git push origin HEAD:overhaul/numeral-spell-handlers
