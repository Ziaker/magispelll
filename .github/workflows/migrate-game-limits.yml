name: Temporary game limits migration

on:
  push:
    branches: [overhaul/game-limits]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/game-limits
      - name: Install dependencies
        run: npm ci
      - name: Extract effective game limits with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/gameLimits.ts';
          const names = ['getEffectiveDrawLimit', 'getEffectiveDiscardLimit'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('gameLimits.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isFunctionDeclaration(stmt) && stmt.name && names.includes(stmt.name.text)) {
              found.set(stmt.name.text, stmt);
            }
          }
          for (const name of names) if (!found.has(name)) throw new Error(`${name} not found`);

          const blocks = [];
          const ranges = [];
          for (const name of names) {
            const node = found.get(name);
            const block = source.slice(node.getFullStart(), node.end).trim();
            if (!block.includes(`export function ${name}`)) throw new Error(`${name} is not exported as expected`);
            blocks.push(block);
            ranges.push([node.getFullStart(), node.end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const importAnchor = "import { DEFAULT_GAME_CONFIG, type GameConfig } from './gameConfig';\n";
          const importLine = "import { getEffectiveDrawLimit, getEffectiveDiscardLimit } from './gameLimits';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('gameConfig import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const exportAnchor = "export { towerEligibleValue, canFormOrReinforceTower } from './towerRules';\n";
          const exportLine = "export { getEffectiveDrawLimit, getEffectiveDiscardLimit } from './gameLimits';\n";
          if (next.split(exportAnchor).length !== 2) throw new Error('towerRules export anchor not found exactly once');
          next = next.replace(exportAnchor, exportAnchor + exportLine);

          const header = [
            '/**',
            ' * gameLimits.ts - limites efetivos derivados da configuração da partida.',
            ' *',
            ' * Centraliza ajustes de variante usados igualmente por motor, UI e IA.',
            ' */',
            "import type { GameConfig } from './gameConfig';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Migrate application imports and boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGETS = {'getEffectiveDrawLimit', 'getEffectiveDiscardLimit'}
          import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )
          moved_total = 0
          changed = []

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name in {'gameEngine.ts', 'gameLimits.ts'}:
                  continue
              text = path.read_text(encoding='utf-8')
              pending = []
              target_source = [None]

              def repl(match):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  remaining = []
                  moved = False
                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'gameLimits'
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          if target_source[0] is not None and target_source[0] != candidate:
                              raise SystemExit(f'{path}: inconsistent gameLimits source')
                          target_source[0] = candidate
                          if base not in pending:
                              pending.append(base)
                          moved = True
                      else:
                          remaining.append(part)
                  if not moved:
                      return match.group(0)
                  if not remaining:
                      return ''
                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = import_re.sub(repl, text)
              if not pending:
                  continue
              target = target_source[0]
              existing_re = re.compile(
                  r"import\s+\{(?P<body>[^}]*)\}\s+from\s+['\"]" + re.escape(target) + r"['\"];",
                  re.DOTALL,
              )
              existing_match = existing_re.search(next_text)
              if existing_match:
                  existing_parts = [p.strip() for p in existing_match.group('body').split(',') if p.strip()]
                  merged = existing_parts + [name for name in pending if name not in existing_parts]
                  replacement = f"import {{ {', '.join(merged)} }} from '{target}';"
                  next_text = next_text[:existing_match.start()] + replacement + next_text[existing_match.end():]
              else:
                  first_import = re.search(r'^import\s', next_text, re.MULTILINE)
                  if not first_import:
                      raise SystemExit(f'{path}: no import insertion point')
                  line = f"import {{ {', '.join(pending)} }} from '{target}';\n"
                  next_text = next_text[:first_import.start()] + line + next_text[first_import.start():]

              for match in import_re.finditer(next_text):
                  for raw in match.group('body').split(','):
                      base = re.sub(r'^type\s+', '', raw.strip()).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          raise SystemExit(f'{path}: {imported_name} still imported through gameEngine')

              path.write_text(next_text, encoding='utf-8')
              changed.append(str(path))
              moved_total += len(pending)

          if moved_total == 0:
              raise SystemExit('no game limit imports found through gameEngine')
          print(f'Moved {moved_total} game-limit import(s) across {len(changed)} file(s)')

          boundary = Path('scripts/import-boundaries-test.ts')
          text = boundary.read_text(encoding='utf-8')
          doc_anchor = " * - towerEligibleValue/canFormOrReinforceTower -> towerRules.ts\n"
          doc_line = " * - getEffectiveDrawLimit/getEffectiveDiscardLimit -> gameLimits.ts\n"
          if text.count(doc_anchor) != 1:
              raise SystemExit('boundary documentation anchor not found exactly once')
          text = text.replace(doc_anchor, doc_anchor + doc_line, 1)

          array_anchor = "  'canFormOrReinforceTower',\n"
          extra = "  'getEffectiveDrawLimit',\n  'getEffectiveDiscardLimit',\n"
          if text.count(array_anchor) != 1:
              raise SystemExit('boundary symbol anchor not found exactly once')
          text = text.replace(array_anchor, array_anchor + extra, 1)

          old_help = "glacialRules.ts ou towerRules.ts"
          new_help = "glacialRules.ts, towerRules.ts ou gameLimits.ts"
          if text.count(old_help) != 1:
              raise SystemExit('boundary help anchor not found exactly once')
          boundary.write_text(text.replace(old_help, new_help, 1), encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts/import-boundaries-test.ts; then
            echo "No game-limit diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/import-boundaries-test.ts
          git commit -m "refactor: extract effective game limits"
          git push origin HEAD:overhaul/game-limits
