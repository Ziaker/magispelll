name: Temporary GameBoard action evaluation migration

on:
  push:
    branches: [overhaul/gameboard-action-evaluation]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/gameboard-action-evaluation
      - name: Replace duplicated no-op detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/components/GameBoard.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { enumerateLegalActions, checkActionDivergence } from '../lib/actionSpace';\n"
          import_line = "import { evaluateAction } from '../lib/actionValidation';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('actionSpace import anchor not found exactly once')
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_fn = """  const isNoOpAiAction = (action: GameAction): boolean => {
    const next = gameReducer(gameState, action);
    if (next === gameState) return true;
    const { log: _prevLog, ...prevRest } = gameState;
    const { log: _nextLog, ...nextRest } = next;
    return JSON.stringify(nextRest) === JSON.stringify(prevRest);
  };"""
          new_fn = """  const isNoOpAiAction = (action: GameAction): boolean =>
    !evaluateAction(gameState, action).accepted;"""
          if text.count(old_fn) != 1:
              raise SystemExit('legacy isNoOpAiAction implementation not found exactly once')
          text = text.replace(old_fn, new_fn, 1)

          old_comment = """   * Detecta isso de forma DETERMINÍSTICA: chama `gameReducer` diretamente
   * contra o `gameState` ATUAL, ANTES de despachar de verdade - a mesma
   * função pura já usada em outros lugares deste arquivo pra \"e se\" sem
   * efeito colateral (ex.: replay do log, ver mais abaixo). Se o resultado
   * é idêntico ao estado atual (ignorando só `log`, que toda rejeição
   * também anexa um aviso nele), a ação NÃO teria nenhum efeito - sabido já
   * agora, sem precisar despachar e esperar repetir."""
          new_comment = """   * Detecta isso de forma DETERMINÍSTICA via `evaluateAction`, a autoridade
   * compartilhada de `actionValidation.ts`: ela executa o reducer real contra
   * o `gameState` ATUAL e considera rejeição qualquer resultado que não altere
   * gameplay, mesmo quando o motor acrescenta apenas uma linha ao log. Assim
   * GameBoard, simuladores e action-space usam exatamente a mesma semântica."""
          if text.count(old_comment) != 1:
              raise SystemExit('legacy no-op comment not found exactly once')
          text = text.replace(old_comment, new_comment, 1)

          old_note = """   * NOTA (custo aceito): quando a ação NÃO é no-op, `gameReducer` roda aqui
   * (só pra comparar) e roda de novo de verdade no dispatch real logo abaixo"""
          new_note = """   * NOTA (custo aceito): quando a ação NÃO é no-op, `evaluateAction` executa
   * `gameReducer` aqui e o reducer roda de novo no dispatch real logo abaixo"""
          if text.count(old_note) != 1:
              raise SystemExit('legacy cost note not found exactly once')
          text = text.replace(old_note, new_note, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm ci
          npm run typecheck
          npm run test:actions
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/components/GameBoard.tsx; then
            echo "No GameBoard diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/GameBoard.tsx
          git commit -m "refactor: use shared action evaluation in GameBoard"
          git push origin HEAD:overhaul/gameboard-action-evaluation
