name: Temporary field operations migration

on:
  push:
    branches: [overhaul/field-operations]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/field-operations
      - name: Install dependencies
        run: npm ci
      - name: Extract pure field operations
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/fieldOperations.ts';
          const names = ['updateFieldSlot', 'returnSlotToHand', 'resolveCombatSlot'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('fieldOperations.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const nodes = names.map((name) => {
            const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === name);
            if (!node) throw new Error(`${name} not found`);
            return node;
          });

          const snippets = nodes.map((node, index) => {
            const name = names[index];
            const text = source.slice(node.getStart(sf), node.end);
            return text.replace(`function ${name}`, `export function ${name}`);
          });

          // Os três helpers são contíguos. Removemos também a trivia/comentários
          // imediatamente anteriores ao primeiro para não deixar documentação órfã.
          const first = nodes[0];
          const last = nodes[nodes.length - 1];
          let next = source.slice(0, first.getFullStart()) + source.slice(last.end);

          const fieldLifecycleImport = "import { isTowerSlot, isBrotoSlot, keepPersistentFieldSlots, nonPersistentFieldCards } from './fieldLifecycle';\n";
          const operationsImport = "import { resolveCombatSlot, returnSlotToHand, updateFieldSlot } from './fieldOperations';\n";
          if (next.split(fieldLifecycleImport).length !== 2) throw new Error('fieldLifecycle import anchor not found exactly once');
          next = next.replace(fieldLifecycleImport, fieldLifecycleImport + operationsImport);

          const hideCardSpecifier = '  hideCard,\n';
          if (next.split(hideCardSpecifier).length !== 2) throw new Error('hideCard import specifier not found exactly once');
          next = next.replace(hideCardSpecifier, '');

          const header = [
            '/**',
            ' * fieldOperations.ts - operações estruturais puras sobre slots de campo.',
            ' *',
            ' * Este módulo não conhece GameState, fases, reducer, UI ou IA. Ele só',
            ' * transforma FieldSlot/arrays de campo e preserva as invariantes de',
            ' * retorno para a mão e erosão/colapso de pilhas de Torre/Broto.',
            ' */',
            "import { hideCard, shuffle, type Card } from './cardUtils';",
            "import type { FieldSlot } from './gameStateTypes';",
            '',
            '/** Atualiza um slot sempre a partir do valor original daquele índice. */',
            snippets[0],
            '',
            '/** Devolve o conteúdo de um slot para a mão e limpa o slot por completo. */',
            snippets[1],
            '',
            '/**',
            ' * Resolve estruturalmente um slot após combate: colapsa a pilha inteira',
            ' * ou erode apenas o topo de uma Torre, promovendo a próxima carta.',
            ' */',
            snippets[2],
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header);
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No field-operations diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract pure field operations"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/field-operations; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
