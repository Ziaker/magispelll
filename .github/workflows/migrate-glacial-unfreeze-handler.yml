name: Temporary Glacial unfreeze handler migration

on:
  push:
    branches: [overhaul/glacial-unfreeze-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/glacial-unfreeze-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract Glacial unfreeze handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/glacialHandlers.ts';
          const functionName = 'handlePayToUnfreeze';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('glacialHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          const block = source.slice(node.getFullStart(), node.end).trim().replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const towerHandlerImport = "import { handleFormOrReinforceTower } from './towerHandlers';\n";
          const glacialHandlerImport = "import { handlePayToUnfreeze } from './glacialHandlers';\n";
          if (next.split(towerHandlerImport).length !== 2) throw new Error('towerHandlers import anchor not found exactly once');
          next = next.replace(towerHandlerImport, towerHandlerImport + glacialHandlerImport);

          const header = [
            '/**',
            ' * glacialHandlers.ts - transições de estado próprias do Glacial.',
            ' *',
            ' * Começa pela mecânica de descongelamento paga; magias continuam',
            ' * separadas até que possam ser extraídas sem acoplamento ao reducer.',
            ' */',
            "import type { Card } from './cardUtils';",
            "import { pushToDiscard } from './deckLifecycle';",
            "import { updateFieldSlot } from './fieldOperations';",
            "import { appendLog } from './gameLog';",
            "import { playerKeyOf } from './gameSelectors';",
            "import { hasStatus, removeStatus } from './statusEffects';",
            "import type { FieldSlot, GameState, PlayerState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + block + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Glacial handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract Glacial unfreeze handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/glacial-unfreeze-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
