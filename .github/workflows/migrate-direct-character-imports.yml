name: Temporary direct CharacterId import migration

on:
  push:
    branches: [overhaul/direct-character-imports]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/direct-character-imports
      - name: Point standalone CharacterId imports at registry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "import type { CharacterId } from './gameEngine';": "import type { CharacterId } from './characterRegistry';",
              "import type { CharacterId } from '../lib/gameEngine';": "import type { CharacterId } from '../lib/characterRegistry';",
          }

          changed = []
          total = 0
          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              next_text = text
              for old, new in replacements.items():
                  count = next_text.count(old)
                  if count > 1:
                      raise SystemExit(f'{path}: expected standalone import at most once, found {count}')
                  if count == 1:
                      next_text = next_text.replace(old, new, 1)
                      total += 1
              if next_text != text:
                  path.write_text(next_text, encoding='utf-8')
                  changed.append(str(path))

          if total == 0:
              raise SystemExit('no standalone CharacterId imports found; refusing empty migration')

          print(f'Migrated {total} standalone imports:')
          for path in changed:
              print(f' - {path}')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No source diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: import CharacterId directly from registry"
          git push origin HEAD:overhaul/direct-character-imports
