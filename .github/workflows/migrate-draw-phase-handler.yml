name: Temporary draw phase handler migration

on:
  push:
    branches: [overhaul/draw-phase-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/draw-phase-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract draw handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/drawPhaseHandlers.ts';
          const functionName = 'handleDrawCards';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('drawPhaseHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          let block = source.slice(node.getFullStart(), node.end).trim();
          if (!block.includes(`function ${functionName}`)) throw new Error('unexpected handler source');
          block = block.replace(`function ${functionName}`, `export function ${functionName}`);

          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);
          const importAnchor = "import { appendLog } from './gameLog';\n";
          const importLine = "import { handleDrawCards } from './drawPhaseHandlers';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('gameLog import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const header = [
            '/**',
            ' * drawPhaseHandlers.ts - transições de estado próprias da fase de Compra.',
            ' *',
            ' * Handlers continuam puros: recebem GameState + payload e devolvem GameState.',
            ' */',
            "import { applyStatus, hasStatus } from './statusEffects';",
            "import { drawCards } from './cardUtils';",
            "import { ensureDeckHasCards } from './deckLifecycle';",
            "import { getEffectiveDrawLimit } from './gameLimits';",
            "import { appendLog } from './gameLog';",
            "import { opponentOf, playerKeyOf } from './gameSelectors';",
            "import type { PlayerNumber } from './gameTypes';",
            "import type { GameState } from './gameStateTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + block + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No draw-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract draw phase handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/draw-phase-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
