name: Temporary Coringa transform handler migration

on:
  push:
    branches: [overhaul/coringa-transform-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/coringa-transform-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract Coringa transform handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/coringaHandlers.ts';
          const functionName = 'handleTransformCoringaMagicCard';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('coringaHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const fusionHandlerImport = "import { handleFuseCards } from './fusionHandlers';\n";
          const handlerImport = "import { handleTransformCoringaMagicCard } from './coringaHandlers';\n";
          if (next.split(fusionHandlerImport).length !== 2) throw new Error('fusion handler import anchor not found exactly once');
          next = next.replace(fusionHandlerImport, fusionHandlerImport + handlerImport);

          const header = [
            '/**',
            ' * coringaHandlers.ts - transições de estado específicas do Coringa.',
            ' *',
            ' * Começa pela transformação de Mão de Ferro; regras puras de armadilha',
            ' * continuam em coringaRules.ts.',
            ' */',
            "import { appendLog } from './gameLog';",
            "import { characterOf, playerKeyOf } from './gameSelectors';",
            "import { hasStatus } from './statusEffects';",
            "import type { GameState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + snippet + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Coringa-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract Coringa transform handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/coringa-transform-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
