name: Temporary direct field lifecycle import migration

on:
  push:
    branches: [overhaul/direct-field-lifecycle-imports]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/direct-field-lifecycle-imports
      - name: Move field lifecycle imports out of gameEngine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGETS = {'isTowerSlot', 'isBrotoSlot'}
          engine_import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )

          changed_files = []
          moved_total = 0

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name == 'gameEngine.ts':
                  continue

              text = path.read_text(encoding='utf-8')
              moved_names = []
              field_source = {'value': None}

              def repl(match):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  remaining = []
                  moved_here = []
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          moved_here.append(part)
                      else:
                          remaining.append(part)
                  if not moved_here:
                      return match.group(0)

                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'fieldLifecycle'
                  if field_source['value'] is None:
                      field_source['value'] = candidate
                  elif field_source['value'] != candidate:
                      raise SystemExit(f'{path}: inconsistent gameEngine import paths')

                  for part in moved_here:
                      normalized = re.sub(r'^type\s+', '', part).strip()
                      if normalized not in moved_names:
                          moved_names.append(normalized)

                  if not remaining:
                      return ''
                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = engine_import_re.sub(repl, text)
              if not moved_names:
                  continue

              source = field_source['value']
              if source is None:
                  raise SystemExit(f'{path}: fieldLifecycle source not resolved')

              existing_re = re.compile(
                  r"import\s+(?:type\s+)?\{(?P<body>[^}]*)\}\s+from\s+['\"]" + re.escape(source) + r"['\"];",
                  re.DOTALL,
              )
              existing = set()
              for found in existing_re.finditer(next_text):
                  for raw in found.group('body').split(','):
                      normalized = re.sub(r'^type\s+', '', raw.strip()).strip()
                      if normalized:
                          existing.add(normalized)

              missing = [name for name in moved_names if name not in existing]
              if missing:
                  first_import = re.search(r'^import\s', next_text, re.MULTILINE)
                  if not first_import:
                      raise SystemExit(f'{path}: no import insertion point')
                  line = f"import {{ {', '.join(missing)} }} from '{source}';\n"
                  next_text = next_text[:first_import.start()] + line + next_text[first_import.start():]

              for match in engine_import_re.finditer(next_text):
                  for raw in match.group('body').split(','):
                      base = re.sub(r'^type\s+', '', raw.strip()).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          raise SystemExit(f'{path}: {imported_name} still imported through gameEngine')

              path.write_text(next_text, encoding='utf-8')
              changed_files.append(str(path))
              moved_total += len(moved_names)

          if moved_total == 0:
              raise SystemExit('no isTowerSlot/isBrotoSlot imports through gameEngine found')

          print(f'Moved {moved_total} field lifecycle import(s) across {len(changed_files)} file(s):')
          for item in changed_files:
              print(f' - {item}')
          PY
      - name: Extend import boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/import-boundaries-test.ts')
          text = path.read_text(encoding='utf-8')

          docs_anchor = ' * - MAX_MONSTER_USES -> monsterLifecycle.ts\n'
          docs_line = docs_anchor + ' * - isTowerSlot/isBrotoSlot -> fieldLifecycle.ts\n'
          if text.count(docs_anchor) != 1:
              raise SystemExit('boundary docs anchor not found exactly once')
          text = text.replace(docs_anchor, docs_line, 1)

          set_anchor = "  'MAX_MONSTER_USES',\n]);"
          set_replacement = "  'MAX_MONSTER_USES',\n  'isTowerSlot',\n  'isBrotoSlot',\n]);"
          if text.count(set_anchor) != 1:
              raise SystemExit('boundary set anchor not found exactly once')
          text = text.replace(set_anchor, set_replacement, 1)

          hint_old = "Use characterRegistry.ts, gameTypes.ts, gameLogTypes.ts, gameActionTypes.ts, gameSelectors.ts ou monsterLifecycle.ts conforme o símbolo."
          hint_new = "Use characterRegistry.ts, gameTypes.ts, gameLogTypes.ts, gameActionTypes.ts, gameSelectors.ts, monsterLifecycle.ts ou fieldLifecycle.ts conforme o símbolo."
          if text.count(hint_old) != 1:
              raise SystemExit('boundary hint anchor not found exactly once')
          text = text.replace(hint_old, hint_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm ci
          npm run typecheck
          npm run test:boundaries
          npm run test:actions
          npm run test:exhaustiveness
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts/import-boundaries-test.ts; then
            echo "No direct field lifecycle import diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/import-boundaries-test.ts
          git commit -m "refactor: import field lifecycle helpers directly"
          git push origin HEAD:overhaul/direct-field-lifecycle-imports
