name: Temporary Glacial rule migration

on:
  push:
    branches: [overhaul/glacial-rules]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/glacial-rules
      - name: Install dependencies
        run: npm ci
      - name: Extract Glacial rules with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/glacialRules.ts';
          const names = ['getGlacialGolemValue', 'isFrozenPlayBlocked', 'isFrozenMagicActivationBlocked'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('glacialRules.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isFunctionDeclaration(stmt) && stmt.name && names.includes(stmt.name.text)) {
              found.set(stmt.name.text, stmt);
            }
          }
          for (const name of names) if (!found.has(name)) throw new Error(`${name} not found`);

          const blocks = [];
          const ranges = [];
          for (const name of names) {
            const node = found.get(name);
            const block = source.slice(node.getFullStart(), node.end).trim();
            if (!block.includes(`export function ${name}`)) throw new Error(`${name} is not exported as expected`);
            blocks.push(block);
            ranges.push([node.getFullStart(), node.end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const importAnchor = "import { fieldCards, wasEverTowerSlot, getUnbattledHorizontalSlots, getDestroyableReinforcementSlots, getUnrevealedFieldSlots, getFilledFieldSlots } from './fieldQueries';\n";
          const importLine = "import { getGlacialGolemValue, isFrozenPlayBlocked, isFrozenMagicActivationBlocked } from './glacialRules';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('fieldQueries import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const exportAnchor = "export { fieldCards, wasEverTowerSlot, getUnbattledHorizontalSlots, getDestroyableReinforcementSlots, getUnrevealedFieldSlots, getFilledFieldSlots } from './fieldQueries';\n";
          const exportLine = "export { getGlacialGolemValue, isFrozenPlayBlocked, isFrozenMagicActivationBlocked } from './glacialRules';\n";
          if (next.split(exportAnchor).length !== 2) throw new Error('fieldQueries export anchor not found exactly once');
          next = next.replace(exportAnchor, exportAnchor + exportLine);

          const header = [
            '/**',
            ' * glacialRules.ts - consultas e guards puros específicos do Glacial.',
            ' *',
            ' * Não conhece reducer, UI ou IA; deriva regras apenas do estado/cartas recebidos.',
            ' */',
            "import type { Card } from './cardUtils';",
            "import type { CharacterId } from './characterRegistry';",
            "import { fieldCards } from './fieldQueries';",
            "import type { GameState } from './gameStateTypes';",
            "import { hasStatus } from './statusEffects';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Migrate application imports and boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGETS = {'getGlacialGolemValue', 'isFrozenPlayBlocked', 'isFrozenMagicActivationBlocked'}
          import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )
          moved_total = 0
          changed = []

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name in {'gameEngine.ts', 'glacialRules.ts'}:
                  continue
              text = path.read_text(encoding='utf-8')
              pending = []
              target_source = [None]

              def repl(match):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  remaining = []
                  moved = False
                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'glacialRules'
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          if target_source[0] is not None and target_source[0] != candidate:
                              raise SystemExit(f'{path}: inconsistent glacialRules source')
                          target_source[0] = candidate
                          if base not in pending:
                              pending.append(base)
                          moved = True
                      else:
                          remaining.append(part)
                  if not moved:
                      return match.group(0)
                  if not remaining:
                      return ''
                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = import_re.sub(repl, text)
              if not pending:
                  continue
              source = target_source[0]
              first_import = re.search(r'^import\s', next_text, re.MULTILINE)
              if not first_import:
                  raise SystemExit(f'{path}: no import insertion point')
              line = f"import {{ {', '.join(pending)} }} from '{source}';\n"
              next_text = next_text[:first_import.start()] + line + next_text[first_import.start():]
              path.write_text(next_text, encoding='utf-8')
              changed.append(str(path))
              moved_total += len(pending)

          print(f'Moved {moved_total} Glacial rule import(s) across {len(changed)} file(s)')

          boundary = Path('scripts/import-boundaries-test.ts')
          text = boundary.read_text(encoding='utf-8')
          doc_anchor = " * - fieldCards/wasEverTowerSlot/getUnbattledHorizontalSlots/getDestroyableReinforcementSlots/getUnrevealedFieldSlots/getFilledFieldSlots -> fieldQueries.ts\n"
          doc_line = " * - getGlacialGolemValue/isFrozenPlayBlocked/isFrozenMagicActivationBlocked -> glacialRules.ts\n"
          if text.count(doc_anchor) != 1:
              raise SystemExit('boundary documentation anchor not found exactly once')
          text = text.replace(doc_anchor, doc_anchor + doc_line, 1)

          array_anchor = "  'getFilledFieldSlots',\n"
          extra = "  'getGlacialGolemValue',\n  'isFrozenPlayBlocked',\n  'isFrozenMagicActivationBlocked',\n"
          if text.count(array_anchor) != 1:
              raise SystemExit('boundary symbol anchor not found exactly once')
          text = text.replace(array_anchor, array_anchor + extra, 1)

          old_help = "fieldLifecycle.ts ou fieldQueries.ts"
          new_help = "fieldLifecycle.ts, fieldQueries.ts ou glacialRules.ts"
          if text.count(old_help) != 1:
              raise SystemExit('boundary help anchor not found exactly once')
          boundary.write_text(text.replace(old_help, new_help, 1), encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts/import-boundaries-test.ts; then
            echo "No Glacial rule diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/import-boundaries-test.ts
          git commit -m "refactor: extract Glacial rules"
          git push origin HEAD:overhaul/glacial-rules
