name: Temporary game log migration

on:
  push:
    branches: [overhaul/game-log]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/game-log
      - name: Install dependencies
        run: npm ci
      - name: Extract structured game log helpers
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/gameLog.ts';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('gameLog.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const wanted = new Set(['LogOptions', 'withPlayerCharacterNames', 'appendLog']);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isInterfaceDeclaration(stmt) && wanted.has(stmt.name.text)) found.set(stmt.name.text, stmt);
            if (ts.isFunctionDeclaration(stmt) && stmt.name && wanted.has(stmt.name.text)) found.set(stmt.name.text, stmt);
          }
          for (const name of wanted) if (!found.has(name)) throw new Error(`${name} not found`);

          const order = ['LogOptions', 'withPlayerCharacterNames', 'appendLog'];
          const blocks = [];
          const ranges = [];
          for (const name of order) {
            const node = found.get(name);
            let block = source.slice(node.getFullStart(), node.end).trim();
            if (name === 'appendLog') block = block.replace('function appendLog', 'export function appendLog');
            blocks.push(block);
            ranges.push([node.getFullStart(), node.end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const logTypeImport = "import type { LogEntry, LogEventType } from './gameLogTypes';\n";
          if (next.includes(logTypeImport)) next = next.replace(logTypeImport, '');
          const themeImport = "import { getCharacterTheme } from './characterThemes';\n";
          if (next.includes(themeImport)) next = next.replace(themeImport, '');

          const importAnchor = "import type { Phase, PlayerNumber, PlayerKey } from './gameTypes';\n";
          const importLine = "import { appendLog } from './gameLog';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('gameTypes import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const header = [
            '/**',
            ' * gameLog.ts - construção pura do log estruturado da partida.',
            ' *',
            ' * Centraliza nomes dos personagens, metadados e retenção das entradas',
            ' * sem depender do reducer, UI ou efeitos colaterais.',
            ' */',
            "import { getCharacterTheme } from './characterThemes';",
            "import type { Phase, PlayerNumber } from './gameTypes';",
            "import type { LogEntry, LogEventType } from './gameLogTypes';",
            "import type { GameState } from './gameStateTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No game-log diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract structured game log helpers"
          git push origin HEAD:overhaul/game-log
