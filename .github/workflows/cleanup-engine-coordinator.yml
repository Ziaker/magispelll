name: Temporary engine coordinator cleanup

on:
  push:
    branches: [overhaul/engine-coordinator-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/engine-coordinator-cleanup
      - name: Install dependencies
        run: npm ci
      - name: Prune engine imports and lock coordinator boundary
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const boundaryPath = 'scripts/import-boundaries-test.ts';
          let source = fs.readFileSync(enginePath, 'utf8');
          let boundaries = fs.readFileSync(boundaryPath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const used = new Set();
          function collect(node) {
            if (ts.isIdentifier(node)) used.add(node.text);
            ts.forEachChild(node, collect);
          }
          for (const stmt of sf.statements) {
            if (ts.isImportDeclaration(stmt) || ts.isExportDeclaration(stmt)) continue;
            collect(stmt);
          }

          const printer = ts.createPrinter({ newLine: ts.NewLineKind.LineFeed });
          const keptImports = [];
          for (const stmt of sf.statements) {
            if (!ts.isImportDeclaration(stmt)) continue;
            const clause = stmt.importClause;
            if (!clause) {
              keptImports.push(stmt);
              continue;
            }

            const defaultName = clause.name && used.has(clause.name.text) ? clause.name : undefined;
            let namedBindings;
            if (clause.namedBindings && ts.isNamespaceImport(clause.namedBindings)) {
              namedBindings = used.has(clause.namedBindings.name.text) ? clause.namedBindings : undefined;
            } else if (clause.namedBindings && ts.isNamedImports(clause.namedBindings)) {
              const elements = clause.namedBindings.elements.filter((spec) => used.has(spec.name.text));
              if (elements.length) namedBindings = ts.factory.updateNamedImports(clause.namedBindings, elements);
            }

            if (!defaultName && !namedBindings) continue;
            const nextClause = ts.factory.updateImportClause(clause, clause.isTypeOnly, defaultName, namedBindings);
            keptImports.push(ts.factory.updateImportDeclaration(stmt, stmt.modifiers, nextClause, stmt.moduleSpecifier, stmt.attributes));
          }

          const imports = sf.statements.filter(ts.isImportDeclaration);
          if (!imports.length) throw new Error('gameEngine has no imports');
          const firstImportStart = imports[0].getStart(sf);
          const lastImportEnd = imports[imports.length - 1].end;
          const printedImports = keptImports.map((stmt) => printer.printNode(ts.EmitHint.Unspecified, stmt, sf)).join('\n');
          source = source.slice(0, firstImportStart) + printedImports + source.slice(lastImportEnd);

          const coordinatorDoc = `/**\n * gameEngine.ts - coordenador puro do Magispelll.\n *\n * Este arquivo preserva a API histórica do motor e roteia GameAction para\n * handlers de domínio. Regras de compra, estratégia, magias, personagens,\n * reações, fases e combate vivem em módulos próprios em src/app/lib.\n *\n * A fronteira intencional aqui é pequena: gameReducer aplica o sweep global\n * pós-ação e reduceGameAction mantém apenas guards globais + dispatch.\n * Nenhum handler/regra de domínio deve voltar a ser implementado neste arquivo.\n *\n * O reducer continua totalmente puro e determinístico: mesmo estado + mesma\n * ação produzem o mesmo próximo estado; timers/animações permanecem na UI.\n */`;
          if (!source.startsWith('/**')) throw new Error('gameEngine header comment not found');
          source = source.replace(/^\/\*\*[\s\S]*?\*\//, coordinatorDoc);

          if (!boundaries.includes("import ts from 'typescript';")) {
            boundaries = boundaries.replace("import assert from 'node:assert/strict';", "import assert from 'node:assert/strict';\nimport ts from 'typescript';");
          }

          const boundaryMarker = "console.log(`✓ import boundaries: ${EXTRACTED_SYMBOLS.size} símbolos extraídos protegidos contra reacoplamento ao gameEngine`);";
          if (!boundaries.includes(boundaryMarker)) throw new Error('boundary insertion marker not found');
          if (boundaries.includes('gameEngine coordinator boundary')) throw new Error('coordinator boundary already exists');

          boundaries = boundaries.replace(boundaryMarker, `${boundaryMarker}\n\n// gameEngine coordinator boundary: depois da decomposição do motor, o arquivo\n// principal só pode declarar o reducer público e seu dispatcher privado.\n// Regras/handlers novos devem nascer no módulo de domínio correspondente.\nconst enginePathForBoundary = join(process.cwd(), 'src', 'app', 'lib', 'gameEngine.ts');\nconst engineSourceForBoundary = readFileSync(enginePathForBoundary, 'utf8');\nconst engineAstForBoundary = ts.createSourceFile(\n  enginePathForBoundary,\n  engineSourceForBoundary,\n  ts.ScriptTarget.Latest,\n  true,\n  ts.ScriptKind.TS\n);\nconst allowedEngineFunctions = new Set(['gameReducer', 'reduceGameAction']);\nconst unexpectedEngineFunctions = engineAstForBoundary.statements\n  .filter(ts.isFunctionDeclaration)\n  .map((statement) => statement.name?.text ?? '<anonymous>')\n  .filter((name) => !allowedEngineFunctions.has(name));\nassert.deepEqual(\n  unexpectedEngineFunctions,\n  [],\n  [\n    'gameEngine.ts deve permanecer um coordenador fino.',\n    'Mova novos handlers/regras para módulos de domínio e apenas faça o dispatch pelo reducer.',\n    \`Funções top-level inesperadas: \${unexpectedEngineFunctions.join(', ')}\`,\n  ].join(' ')\n);\nconsole.log('✓ gameEngine coordinator boundary: apenas gameReducer/reduceGameAction permanecem como funções top-level');`);

          fs.writeFileSync(enginePath, source);
          fs.writeFileSync(boundaryPath, boundaries);
          console.log(`Pruned imports: ${imports.length} -> ${keptImports.length}`);
          NODE
      - name: Validate cleanup
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit cleanup
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts scripts/import-boundaries-test.ts; then
            echo "No coordinator cleanup diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts scripts/import-boundaries-test.ts
          git commit -m "refactor: lock game engine as thin coordinator"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/engine-coordinator-cleanup; then exit 0; fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
