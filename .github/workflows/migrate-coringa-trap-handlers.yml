name: Temporary Coringa trap handler migration

on:
  push:
    branches: [overhaul/coringa-trap-handlers]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/coringa-trap-handlers
      - name: Install dependencies
        run: npm ci
      - name: Extract Coringa trap reaction cluster
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/coringaTrapHandlers.ts';
          const names = ['applyCoringaTrapReaction', 'resolveCoringaTrapTargeting', 'tryCoringaJShieldBlock'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('coringaTrapHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const nodes = names.map((name) => {
            const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === name);
            if (!node) throw new Error(`${name} not found`);
            return { name, node };
          });

          const snippets = nodes.map(({ name, node }) => {
            const text = source.slice(node.getFullStart(), node.end).trim();
            return text.replace(`function ${name}`, `export function ${name}`);
          });

          let next = source;
          for (const { node } of [...nodes].sort((a, b) => b.node.getFullStart() - a.node.getFullStart())) {
            next = next.slice(0, node.getFullStart()) + next.slice(node.end);
          }

          const coringaHandlerImport = "import { handleTransformCoringaMagicCard } from './coringaHandlers';\n";
          const trapImport = "import { resolveCoringaTrapTargeting, tryCoringaJShieldBlock } from './coringaTrapHandlers';\n";
          if (next.split(coringaHandlerImport).length !== 2) throw new Error('coringaHandlers import anchor not found exactly once');
          next = next.replace(coringaHandlerImport, coringaHandlerImport + trapImport);

          const header = [
            '/**',
            ' * coringaTrapHandlers.ts - reações automáticas das armadilhas do Coringa.',
            ' *',
            ' * Concentra reação ao ser alvejada/revelada e o escudo do Valete.',
            ' * Não depende do reducer nem importa gameEngine.ts.',
            ' */',
            "import { drawCards, reshuffleDiscardIntoDeck, resetCardForDiscard, shuffle, type Card } from './cardUtils';",
            "import { ensureDeckHasCards, pushToDiscard } from './deckLifecycle';",
            "import { appendLog } from './gameLog';",
            "import { characterOf, playerKeyOf } from './gameSelectors';",
            "import { isCoringaRawTrapCard } from './coringaRules';",
            "import { applyTimedCombatModifier } from './statusEffects';",
            "import type { FieldSlot, GameState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + snippets.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Coringa trap-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract Coringa trap reaction handlers"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/coringa-trap-handlers; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
