name: Temporary game state factory migration

on:
  push:
    branches: [overhaul/game-state-factory]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/game-state-factory
      - name: Install dependencies
        run: npm ci
      - name: Extract state factories with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/gameStateFactory.ts';
          const names = ['emptyField', 'createPlayerState'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('gameStateFactory.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isFunctionDeclaration(stmt) && stmt.name && names.includes(stmt.name.text)) {
              found.set(stmt.name.text, stmt);
            }
          }
          for (const name of names) if (!found.has(name)) throw new Error(`${name} not found`);

          const blocks = [];
          const ranges = [];
          for (const name of names) {
            const node = found.get(name);
            let block = source.slice(node.getFullStart(), node.end).trim();
            block = block.replace(`function ${name}`, `export function ${name}`);
            if (!block.includes(`export function ${name}`)) throw new Error(`failed to export ${name}`);
            blocks.push(block);
            ranges.push([node.getFullStart(), node.end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const importAnchor = "import type { FieldSlot, PlayerState, CombatResolution, NumeralSpellPending, PendingReaction, GameState } from './gameStateTypes';\n";
          const importLine = "import { emptyField, createPlayerState } from './gameStateFactory';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('gameStateTypes import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const header = [
            '/**',
            ' * gameStateFactory.ts - construção de estruturas-base do estado.',
            ' *',
            ' * Mantém defaults estruturais fora do reducer sem conhecer fases globais,',
            ' * baralho, Spotlight, logs, IA ou UI.',
            ' */',
            "import type { Card } from './cardUtils';",
            "import type { FieldSlot, PlayerState } from './gameStateTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts src/app/lib/gameStateFactory.ts; then
            echo "No game state factory diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts src/app/lib/gameStateFactory.ts
          git commit -m "refactor: extract game state factories"
          git push origin HEAD:overhaul/game-state-factory
