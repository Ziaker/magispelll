name: Temporary ready phase handler migration

on:
  push:
    branches: [overhaul/ready-phase-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/ready-phase-handler
      - name: Install dependencies
        run: npm ci
      - name: Move ready phase handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const handlersPath = 'src/app/lib/phaseHandlers.ts';
          const functionName = 'handleToggleReady';
          const source = fs.readFileSync(enginePath, 'utf8');
          let handlers = fs.readFileSync(handlersPath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const phaseImport = "import { advancePhaseState } from './phaseHandlers';";
          const nextPhaseImport = "import { advancePhaseState, handleToggleReady } from './phaseHandlers';";
          if (next.split(phaseImport).length !== 2) throw new Error('phaseHandlers engine import anchor not found exactly once');
          next = next.replace(phaseImport, nextPhaseImport);
          next = next.replace(
            "import { isTowerSlot, isBrotoSlot, keepPersistentFieldSlots, nonPersistentFieldCards } from './fieldLifecycle';",
            "import { isTowerSlot, isBrotoSlot } from './fieldLifecycle';"
          );

          handlers = handlers.replace(
            "import { nonPersistentFieldCards } from './fieldLifecycle';",
            "import { keepPersistentFieldSlots, nonPersistentFieldCards } from './fieldLifecycle';"
          );
          handlers = handlers.replace(
            "import type { GameState } from './gameStateTypes';",
            "import { opponentKeyOf, playerKeyOf } from './gameSelectors';\nimport type { GameState } from './gameStateTypes';\nimport type { PlayerNumber } from './gameTypes';"
          );
          handlers = handlers.trimEnd() + '\n\n' + snippet + '\n';

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(handlersPath, handlers);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No ready-phase diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: move ready handler into phase domain"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/ready-phase-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
