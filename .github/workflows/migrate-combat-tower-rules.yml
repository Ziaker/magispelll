name: Temporary combat tower rule migration

on:
  push:
    branches: [overhaul/combat-tower-rules]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/combat-tower-rules
      - name: Install dependencies
        run: npm ci
      - name: Extract lone tower combat rule with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/combatTowerRules.ts';
          const functionName = 'computeLoneTowerForCombat';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('combatTowerRules.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          const start = node.getFullStart();
          const end = node.end;
          let block = source.slice(start, end).trim();
          block = block.replace(`function ${functionName}`, `export function ${functionName}`);
          if (!block.includes(`export function ${functionName}`)) throw new Error(`failed to export ${functionName}`);

          let next = source.slice(0, start) + source.slice(end);
          const importAnchor = "import { isTowerSlot, isBrotoSlot, keepPersistentFieldSlots, nonPersistentFieldCards } from './fieldLifecycle';\n";
          const importLine = "import { computeLoneTowerForCombat } from './combatTowerRules';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('fieldLifecycle import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const header = [
            '/**',
            ' * combatTowerRules.ts - regras puras de Torre específicas da entrada em Combate.',
            ' *',
            ' * Não resolve combate nem muta estado; apenas deriva metadados do campo atual.',
            ' */',
            "import { isTowerSlot } from './fieldLifecycle';",
            "import type { PlayerNumber } from './gameTypes';",
            "import type { FieldSlot, GameState } from './gameStateTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + block + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts src/app/lib/combatTowerRules.ts; then
            echo "No combat tower rule diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts src/app/lib/combatTowerRules.ts
          git commit -m "refactor: extract lone tower combat rule"
          git push origin HEAD:overhaul/combat-tower-rules
