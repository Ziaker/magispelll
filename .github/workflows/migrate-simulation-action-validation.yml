name: Temporary simulation action validation migration

on:
  push:
    branches:
      - overhaul/simulation-action-validation

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/simulation-action-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migration
        run: |
          python3 .github/scripts/migrate_simulation_action_validation.py
          python3 .github/scripts/fix_piromante_fireball_phase.py
      - name: Validate migration
        run: |
          npm run typecheck
          npm run test:actions
          npm test
          npm run test:exhaustiveness
          npm run test:characters
          npm run test:boundaries
          npm run build
          npm run fuzz -- --games 2 --steps 80 --substitute 1 --authority predicted --seed 22222
          npm run fuzz -- --games 2 --steps 80 --substitute 1 --authority reducer --seed 33333
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No simulation validation diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "fix: align simulation rejection semantics and Piromante AI"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/simulation-action-validation; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
