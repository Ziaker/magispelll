name: Temporary initial state factory migration

on:
  push:
    branches: [overhaul/initial-state-factory]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/initial-state-factory
      - name: Install dependencies
        run: npm ci
      - name: Move createInitialState into gameStateFactory
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const factoryPath = 'src/app/lib/gameStateFactory.ts';
          const functionName = 'createInitialState';
          const source = fs.readFileSync(enginePath, 'utf8');
          let factory = fs.readFileSync(factoryPath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          const block = source.slice(node.getFullStart(), node.end).trim();
          if (!block.includes(`export function ${functionName}`)) throw new Error(`${functionName} is not exported as expected`);

          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const oldFactoryImport = "import { emptyField, createPlayerState } from './gameStateFactory';";
          const newFactoryImport = "import { emptyField, createPlayerState, createInitialState } from './gameStateFactory';";
          if (next.split(oldFactoryImport).length !== 2) throw new Error('gameStateFactory import anchor not found exactly once');
          next = next.replace(oldFactoryImport, newFactoryImport);

          const exportAnchor = "export { getEffectiveDrawLimit, getEffectiveDiscardLimit } from './gameLimits';\n";
          const exportLine = "export { createInitialState } from './gameStateFactory';\n";
          if (next.split(exportAnchor).length !== 2) throw new Error('gameLimits export anchor not found exactly once');
          next = next.replace(exportAnchor, exportAnchor + exportLine);

          // `generateDeck` era usado apenas pela criação inicial; as compras normais continuam usando `drawCards`.
          if (!next.includes('generateDeck(')) {
            next = next.replace('  generateDeck,\n', '');
          }

          // A fábrica passa a conhecer a construção do estado completo, então ajusta o cabeçalho e imports.
          factory = factory.replace(
            ' * Mantém defaults estruturais fora do reducer sem conhecer fases globais,\n * baralho, Spotlight, logs, IA ou UI.\n',
            ' * Mantém defaults estruturais e a construção inicial da partida fora do reducer.\n * Não conhece IA nem UI; apenas compõe tipos, baralho, Spotlight e defaults de estado.\n'
          );
          const oldImports = "import type { Card } from './cardUtils';\nimport type { FieldSlot, PlayerState } from './gameStateTypes';\n";
          const newImports = [
            "import { drawCards, generateDeck, type Card } from './cardUtils';",
            "import type { CharacterId } from './characterRegistry';",
            "import type { GameConfig } from './gameConfig';",
            "import { rollSpotlight } from './spotlight';",
            "import type { FieldSlot, GameState, PlayerState } from './gameStateTypes';",
            '',
          ].join('\n');
          if (factory.split(oldImports).length !== 2) throw new Error('gameStateFactory import anchor not found exactly once');
          factory = factory.replace(oldImports, newImports);
          factory = factory.trimEnd() + '\n\n' + block + '\n';

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(factoryPath, factory);
          NODE
      - name: Migrate createInitialState imports and boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGET = 'createInitialState'
          roots = [Path('src/app'), Path('scripts')]
          import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )
          moved = []

          for root in roots:
            for path in sorted(root.rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name in {'gameEngine.ts', 'gameStateFactory.ts'}:
                  continue
              text = path.read_text(encoding='utf-8')
              found_target = [False]
              target_source = [None]

              def repl(match):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  remaining = []
                  changed = False
                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'gameStateFactory'
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name == TARGET:
                          target_source[0] = candidate
                          found_target[0] = True
                          changed = True
                      else:
                          remaining.append(part)
                  if not changed:
                      return match.group(0)
                  if not remaining:
                      return ''
                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = import_re.sub(repl, text)
              if not found_target[0]:
                  continue
              target = target_source[0]
              existing_re = re.compile(
                  r"import\s+\{(?P<body>[^}]*)\}\s+from\s+['\"]" + re.escape(target) + r"['\"];",
                  re.DOTALL,
              )
              existing = existing_re.search(next_text)
              if existing:
                  parts = [p.strip() for p in existing.group('body').split(',') if p.strip()]
                  if TARGET not in parts:
                      parts.append(TARGET)
                  replacement = f"import {{ {', '.join(parts)} }} from '{target}';"
                  next_text = next_text[:existing.start()] + replacement + next_text[existing.end():]
              else:
                  first_import = re.search(r'^import\s', next_text, re.MULTILINE)
                  if not first_import:
                      raise SystemExit(f'{path}: no import insertion point')
                  next_text = next_text[:first_import.start()] + f"import {{ {TARGET} }} from '{target}';\n" + next_text[first_import.start():]
              path.write_text(next_text, encoding='utf-8')
              moved.append(str(path))

          if not moved:
              raise SystemExit('no createInitialState imports found through gameEngine')
          print(f'Moved createInitialState across {len(moved)} file(s): {moved}')

          boundary = Path('scripts/import-boundaries-test.ts')
          text = boundary.read_text(encoding='utf-8')
          doc_anchor = " * - FieldSlot/PlayerState/CombatResolution/NumeralSpellPending/PendingReaction/GameState -> gameStateTypes.ts\n"
          doc_line = " * - createInitialState -> gameStateFactory.ts\n"
          if text.count(doc_anchor) != 1:
              raise SystemExit('initial state boundary documentation anchor not found exactly once')
          text = text.replace(doc_anchor, doc_anchor + doc_line, 1)
          array_anchor = "  'GameState',\n"
          if text.count(array_anchor) != 1:
              raise SystemExit('initial state boundary symbol anchor not found exactly once')
          text = text.replace(array_anchor, array_anchor + "  'createInitialState',\n", 1)
          old_help = "gameStateTypes.ts, gameSelectors.ts"
          new_help = "gameStateTypes.ts, gameStateFactory.ts, gameSelectors.ts"
          if text.count(old_help) != 1:
              raise SystemExit('initial state boundary help anchor not found exactly once')
          boundary.write_text(text.replace(old_help, new_help, 1), encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts; then
            echo "No initial-state diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts
          git commit -m "refactor: move initial state creation to factory"
          git push origin HEAD:overhaul/initial-state-factory
