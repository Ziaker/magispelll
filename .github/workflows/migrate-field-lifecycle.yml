name: Temporary field lifecycle migration

on:
  push:
    branches: [overhaul/field-lifecycle]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/field-lifecycle
      - name: Install dependencies
        run: npm ci
      - name: Extract field lifecycle helpers with TypeScript AST
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/fieldLifecycle.ts';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('fieldLifecycle.ts already exists');

          const names = ['isTowerSlot', 'isBrotoSlot', 'keepPersistentFieldSlots', 'nonPersistentFieldCards'];
          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isFunctionDeclaration(stmt) && stmt.name && names.includes(stmt.name.text)) {
              found.set(stmt.name.text, stmt);
            }
          }
          for (const name of names) if (!found.has(name)) throw new Error(`${name} not found`);

          const blocks = [];
          const ranges = [];
          for (const name of names) {
            const node = found.get(name);
            const start = node.getFullStart();
            const end = node.end;
            let block = source.slice(start, end).trim();
            if (!block.includes(`export function ${name}`)) {
              block = block.replace(`function ${name}`, `export function ${name}`);
            }
            if (!block.includes(`export function ${name}`)) throw new Error(`failed to export ${name}`);
            blocks.push(block);
            ranges.push([start, end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const importAnchor = "import { MAX_MONSTER_USES, resolveMonsterCardAtTurnEnd } from './monsterLifecycle';\n";
          const importLine = "import { isTowerSlot, isBrotoSlot, keepPersistentFieldSlots, nonPersistentFieldCards } from './fieldLifecycle';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('monsterLifecycle import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          const exportAnchor = "export { MAX_MONSTER_USES } from './monsterLifecycle';\n";
          const exportLine = "export { isTowerSlot, isBrotoSlot } from './fieldLifecycle';\n";
          if (next.split(exportAnchor).length !== 2) throw new Error('monsterLifecycle export anchor not found exactly once');
          next = next.replace(exportAnchor, exportAnchor + exportLine);

          const header = [
            '/**',
            ' * fieldLifecycle.ts - identidade de slots persistentes e limpeza de fim de turno.',
            ' *',
            ' * Torres e Brotos persistem entre turnos; os demais slots são limpos e suas',
            ' * cartas seguem para o descarte. Este módulo concentra essa regra sem conhecer',
            ' * fase, UI, IA ou a implementação do reducer.',
            ' */',
            "import type { Card } from './cardUtils';",
            "import type { FieldSlot } from './gameEngine';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app/lib/gameEngine.ts src/app/lib/fieldLifecycle.ts; then
            echo "No field lifecycle diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/gameEngine.ts src/app/lib/fieldLifecycle.ts
          git commit -m "refactor: extract field lifecycle from engine"
          git push origin HEAD:overhaul/field-lifecycle
