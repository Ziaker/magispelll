name: Temporary simple magic handler migration

on:
  push:
    branches: [overhaul/simple-magic-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/simple-magic-handler
      - name: Install dependencies
        run: npm ci
      - name: Move simple magic handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const handlerPath = 'src/app/lib/magicHandlers.ts';
          const source = fs.readFileSync(enginePath, 'utf8');
          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const functionName = 'handleActivateSimpleMagic';
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found exactly as top-level function`);
          if (fs.existsSync(handlerPath)) throw new Error(`${handlerPath} already exists; aborting to avoid overwrite`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const importAnchor = "import { handleSelectCombatSlot } from './combatHandlers';";
          if (next.split(importAnchor).length !== 2) throw new Error('engine import anchor not found exactly once');
          next = next.replace(importAnchor, `${importAnchor}\nimport { handleActivateSimpleMagic } from './magicHandlers';`);

          const handler = `/**\n * magicHandlers.ts - handlers de ativação/execução das magias J/Q/K.\n *\n * Começa pelas ativações simples (Anjo J/K) e cresce por domínio, sem\n * depender de gameEngine.ts.\n */\nimport { reshuffleDiscardIntoDeck } from './cardUtils';\nimport { pushToDiscard } from './deckLifecycle';\nimport { appendLog } from './gameLog';\nimport { playerKeyOf, characterOf } from './gameSelectors';\nimport type { GameState } from './gameStateTypes';\nimport type { PlayerNumber } from './gameTypes';\nimport { canActivateMagic } from './magicCards';\nimport { getMagicActivationContext } from './magicActivationContext';\n\n${snippet}\n`;

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(handlerPath, handler);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No simple-magic diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract simple magic handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/simple-magic-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
