name: Temporary reducer-backed actions migration

on:
  push:
    branches:
      - overhaul/reducer-backed-actions

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/reducer-backed-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migration
        run: python3 .github/scripts/migrate_reducer_backed_actions.py
      - name: Validate migration
        run: |
          npm run typecheck
          npm run test:actions
          npm test
          npm run test:exhaustiveness
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts; then
            echo "No reducer-backed actions diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts
          git commit -m "refactor: add reducer-backed accepted actions"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/reducer-backed-actions; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
