name: Temporary tower handler migration

on:
  push:
    branches: [overhaul/tower-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/tower-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract tower handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/towerHandlers.ts';
          const functionName = 'handleFormOrReinforceTower';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('towerHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          const block = source.slice(node.getFullStart(), node.end).trim().replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const towerRulesImport = "import { computeLoneTowerForCombat, towerEligibleValue, canFormOrReinforceTower } from './towerRules';";
          const nextTowerRulesImport = "import { computeLoneTowerForCombat } from './towerRules';";
          if (next.split(towerRulesImport).length !== 2) throw new Error('towerRules import anchor not found exactly once');
          next = next.replace(towerRulesImport, nextTowerRulesImport);

          const strategyImport = "import { handleReturnCardToHand, handleReturnHorizontalCardToHand, handleSwapFieldCard } from './strategyFieldHandlers';\n";
          const towerHandlerImport = "import { handleFormOrReinforceTower } from './towerHandlers';\n";
          if (next.split(strategyImport).length !== 2) throw new Error('strategyFieldHandlers import anchor not found exactly once');
          next = next.replace(strategyImport, strategyImport + towerHandlerImport);

          const header = [
            '/**',
            ' * towerHandlers.ts - transições de estado próprias do Modo Towers.',
            ' *',
            ' * Validação de elegibilidade continua em towerRules; este módulo aplica',
            ' * a transformação da mão/campo depois que a ação foi aceita.',
            ' */',
            "import { getEffectiveCardValue } from './cardUtils';",
            "import { isTowerSlot } from './fieldLifecycle';",
            "import { appendLog } from './gameLog';",
            "import { playerKeyOf } from './gameSelectors';",
            "import { canFormOrReinforceTower } from './towerRules';",
            "import type { FieldSlot, GameState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + block + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No tower-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract tower handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/tower-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
