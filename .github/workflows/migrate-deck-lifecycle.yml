name: Temporary deck lifecycle migration

on:
  push:
    branches: [overhaul/deck-lifecycle]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/deck-lifecycle
      - name: Install dependencies
        run: npm ci
      - name: Extract deck lifecycle helpers
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/deckLifecycle.ts';
          const names = ['pushToDiscard', 'ensureDeckHasCards', 'ensureDeckHasAtLeast'];
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('deckLifecycle.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const found = new Map();
          for (const stmt of sf.statements) {
            if (ts.isFunctionDeclaration(stmt) && stmt.name && names.includes(stmt.name.text)) {
              found.set(stmt.name.text, stmt);
            }
          }
          for (const name of names) if (!found.has(name)) throw new Error(`${name} not found`);

          const blocks = [];
          const ranges = [];
          for (const name of names) {
            const node = found.get(name);
            let block = source.slice(node.getFullStart(), node.end).trim();
            if (!block.includes(`function ${name}`)) throw new Error(`${name} source block unexpected`);
            block = block.replace(`function ${name}`, `export function ${name}`);
            blocks.push(block);
            ranges.push([node.getFullStart(), node.end]);
          }

          let next = source;
          for (const [start, end] of ranges.sort((a, b) => b[0] - a[0])) {
            next = next.slice(0, start) + next.slice(end);
          }

          const importAnchor = "import { MAX_MONSTER_USES, resolveMonsterCardAtTurnEnd, canActivateMonsterEffect } from './monsterLifecycle';\n";
          const importLine = "import { pushToDiscard, ensureDeckHasCards, ensureDeckHasAtLeast } from './deckLifecycle';\n";
          if (next.split(importAnchor).length !== 2) throw new Error('monsterLifecycle import anchor not found exactly once');
          next = next.replace(importAnchor, importAnchor + importLine);

          for (const line of [
            '  expandSyntheticCard,\n',
            '  reshuffleDiscardIntoDeck,\n',
            '  resetCardsForDiscard,\n',
          ]) {
            if (next.includes(line)) next = next.replace(line, '');
          }

          const header = [
            '/**',
            ' * deckLifecycle.ts - operações puras de descarte e reembaralhamento.',
            ' *',
            ' * Centraliza conservação de cartas sintéticas e recuperação do baralho vazio',
            ' * sem conhecer fases, personagens, UI, IA ou o reducer.',
            ' */',
            "import { expandSyntheticCard, reshuffleDiscardIntoDeck, resetCardsForDiscard, type Card } from './cardUtils';",
            "import type { GameState } from './gameStateTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + blocks.join('\n\n') + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No deck lifecycle diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract deck lifecycle helpers"
          git push origin HEAD:overhaul/deck-lifecycle
