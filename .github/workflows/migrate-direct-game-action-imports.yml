name: Temporary direct game action import migration

on:
  push:
    branches: [overhaul/direct-game-action-imports]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/direct-game-action-imports
      - name: Move action type imports out of gameEngine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGETS = {'GameAction', 'MagicSelection'}
          engine_import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )

          changed_files = []
          moved_total = 0

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name == 'gameEngine.ts':
                  continue

              text = path.read_text(encoding='utf-8')
              moved_names = []
              resolved_source = {'value': None}

              def repl(match):
                  body = match.group('body')
                  parts = [p.strip() for p in body.split(',') if p.strip()]
                  moved_here = []
                  remaining = []
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          moved_here.append(part)
                      else:
                          remaining.append(part)
                  if not moved_here:
                      return match.group(0)

                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'gameActionTypes'
                  if resolved_source['value'] is None:
                      resolved_source['value'] = candidate
                  elif resolved_source['value'] != candidate:
                      raise SystemExit(f'{path}: inconsistent gameEngine import paths')

                  for part in moved_here:
                      normalized = re.sub(r'^type\s+', '', part).strip()
                      if normalized not in moved_names:
                          moved_names.append(normalized)

                  if not remaining:
                      return ''

                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = engine_import_re.sub(repl, text)
              if not moved_names:
                  continue

              action_source = resolved_source['value']
              if action_source is None:
                  raise SystemExit(f'{path}: action type import source not resolved')

              existing_re = re.compile(
                  r"import\s+(?:type\s+)?\{(?P<body>[^}]*)\}\s+from\s+['\"]"
                  + re.escape(action_source)
                  + r"['\"];",
                  re.DOTALL,
              )
              existing_names = set()
              for existing in existing_re.finditer(next_text):
                  for part in existing.group('body').split(','):
                      base = re.sub(r'^type\s+', '', part.strip()).strip()
                      if base:
                          existing_names.add(base)

              missing = [name for name in moved_names if name not in existing_names]
              if missing:
                  first_import = re.search(r'^import\s', next_text, re.MULTILINE)
                  if not first_import:
                      raise SystemExit(f'{path}: no import insertion point')
                  line = f"import type {{ {', '.join(missing)} }} from '{action_source}';\n"
                  next_text = next_text[:first_import.start()] + line + next_text[first_import.start():]

              for remaining_import in engine_import_re.finditer(next_text):
                  for raw in remaining_import.group('body').split(','):
                      base = re.sub(r'^type\s+', '', raw.strip()).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name in TARGETS:
                          raise SystemExit(f'{path}: {imported_name} still imported through gameEngine')

              path.write_text(next_text, encoding='utf-8')
              changed_files.append(str(path))
              moved_total += len(moved_names)

          if moved_total == 0:
              raise SystemExit('no GameAction/MagicSelection imports through gameEngine found')

          print(f'Moved {moved_total} action type import(s) across {len(changed_files)} file(s):')
          for changed in changed_files:
              print(f' - {changed}')
          PY
      - name: Extend import boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/import-boundaries-test.ts')
          text = path.read_text(encoding='utf-8')
          old_docs = " * - LogEntry/LogEventType -> gameLogTypes.ts\n"
          new_docs = old_docs + " * - GameAction/MagicSelection -> gameActionTypes.ts\n"
          if text.count(old_docs) != 1:
              raise SystemExit('boundary docs anchor not found exactly once')
          text = text.replace(old_docs, new_docs, 1)

          old_tail = "  'LogEntry',\n  'LogEventType',\n]);"
          new_tail = "  'LogEntry',\n  'LogEventType',\n  'GameAction',\n  'MagicSelection',\n]);"
          if text.count(old_tail) != 1:
              raise SystemExit('EXTRACTED_TYPES anchor not found exactly once')
          text = text.replace(old_tail, new_tail, 1)

          old_hint = "    'Use characterRegistry.ts, gameTypes.ts ou gameLogTypes.ts conforme o tipo.',"
          new_hint = "    'Use characterRegistry.ts, gameTypes.ts, gameLogTypes.ts ou gameActionTypes.ts conforme o tipo.',"
          if text.count(old_hint) != 1:
              raise SystemExit('boundary hint anchor not found exactly once')
          text = text.replace(old_hint, new_hint, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm ci
          npm run typecheck
          npm run test:actions
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts/import-boundaries-test.ts; then
            echo "No migration diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/import-boundaries-test.ts
          git commit -m "refactor: import game action types directly"
          git push origin HEAD:overhaul/direct-game-action-imports
