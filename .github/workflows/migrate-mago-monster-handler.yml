name: Temporary Mago monster handler migration

on:
  push:
    branches: [overhaul/mago-monster-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/mago-monster-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract Mago monster handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/magoMonsterHandlers.ts';
          const functionName = 'handleExecuteMagoMonsterEffect';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('magoMonsterHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          const used = new Set();
          (function visit(current) {
            if (ts.isIdentifier(current)) used.add(current.text);
            ts.forEachChild(current, visit);
          })(node);

          const imports = [];
          for (const stmt of sf.statements) {
            if (!ts.isImportDeclaration(stmt) || !stmt.importClause || !ts.isStringLiteral(stmt.moduleSpecifier)) continue;
            const clause = stmt.importClause;
            const moduleName = stmt.moduleSpecifier.text;
            const defaultName = clause.name?.text;
            const useDefault = defaultName && used.has(defaultName);
            const bindings = clause.namedBindings;
            let namedText = '';

            if (bindings && ts.isNamedImports(bindings)) {
              const kept = bindings.elements.filter((el) => used.has(el.name.text));
              if (kept.length > 0) {
                namedText = `{ ${kept.map((el) => {
                  const alias = el.propertyName ? `${el.propertyName.text} as ` : '';
                  const typePrefix = !clause.isTypeOnly && el.isTypeOnly ? 'type ' : '';
                  return `${typePrefix}${alias}${el.name.text}`;
                }).join(', ')} }`;
              }
            } else if (bindings && ts.isNamespaceImport(bindings) && used.has(bindings.name.text)) {
              namedText = `* as ${bindings.name.text}`;
            }

            if (!useDefault && !namedText) continue;
            const pieces = [];
            if (useDefault) pieces.push(defaultName);
            if (namedText) pieces.push(namedText);
            imports.push(`import ${clause.isTypeOnly ? 'type ' : ''}${pieces.join(', ')} from '${moduleName}';`);
          }

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const simpleImport = "import { handleActivateMonsterEffectSimple } from './monsterEffectHandlers';\n";
          const magoImport = "import { handleExecuteMagoMonsterEffect } from './magoMonsterHandlers';\n";
          if (next.split(simpleImport).length !== 2) throw new Error('monsterEffectHandlers import anchor not found exactly once');
          next = next.replace(simpleImport, simpleImport + magoImport);

          const header = [
            '/**',
            ' * magoMonsterHandlers.ts - efeito de Zona Monstro específico do Mago.',
            ' *',
            ' * Mantém o fluxo dedicado de seleção do Mago fora do reducer e sem',
            ' * depender de gameEngine.ts.',
            ' */',
            ...imports,
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + snippet + '\n');
          fs.writeFileSync(enginePath, next);
          console.log(`Generated imports (${imports.length}):`);
          console.log(imports.join('\n'));
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No Mago-monster diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract Mago monster effect handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/mago-monster-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
