name: Temporary fusion handler migration

on:
  push:
    branches: [overhaul/fusion-handler]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/fusion-handler
      - name: Install dependencies
        run: npm ci
      - name: Extract fusion handler
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const outPath = 'src/app/lib/fusionHandlers.ts';
          const functionName = 'handleFuseCards';
          const source = fs.readFileSync(enginePath, 'utf8');
          if (fs.existsSync(outPath)) throw new Error('fusionHandlers.ts already exists');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);

          let snippet = source.slice(node.getFullStart(), node.end).trim();
          snippet = snippet.replace(`function ${functionName}`, `export function ${functionName}`);
          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const fusionImport = "import { canFuseCards, computeFusionResult } from './fusion';\n";
          if (next.split(fusionImport).length !== 2) throw new Error('fusion import anchor not found exactly once');
          next = next.replace(fusionImport, '');

          const monsterHandlerImport = "import { handlePlaceMonsterCard } from './monsterHandlers';\n";
          const handlerImport = "import { handleFuseCards } from './fusionHandlers';\n";
          if (next.split(monsterHandlerImport).length !== 2) throw new Error('monster handler import anchor not found exactly once');
          next = next.replace(monsterHandlerImport, monsterHandlerImport + handlerImport);

          const header = [
            '/**',
            ' * fusionHandlers.ts - transição de estado da variante Fusão.',
            ' *',
            ' * Elegibilidade e cálculo continuam em fusion.ts; este módulo apenas',
            ' * aplica a fusão aceita à mão/contador/log sem depender do reducer.',
            ' */',
            "import type { Card } from './cardUtils';",
            "import { canFuseCards, computeFusionResult } from './fusion';",
            "import { appendLog } from './gameLog';",
            "import { playerKeyOf } from './gameSelectors';",
            "import type { GameState } from './gameStateTypes';",
            "import type { PlayerNumber } from './gameTypes';",
            '',
          ].join('\n');

          fs.writeFileSync(outPath, header + snippet + '\n');
          fs.writeFileSync(enginePath, next);
          NODE
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
          npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No fusion-handler diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: extract fusion handler"
          for attempt in 1 2 3; do
            if git push origin HEAD:overhaul/fusion-handler; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          exit 1
