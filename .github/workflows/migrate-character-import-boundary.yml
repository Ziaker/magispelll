name: Temporary CharacterId import-boundary migration

on:
  push:
    branches: [overhaul/character-import-boundary]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/character-import-boundary
      - name: Move CharacterId out of gameEngine imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )
          changed_files = []
          moved = 0

          def transform_file(path: Path):
              nonlocal_state = {'moved': 0}
              text = path.read_text(encoding='utf-8')

              def repl(match):
                  body = match.group('body')
                  parts = [p.strip() for p in body.split(',') if p.strip()]
                  char_parts = [p for p in parts if re.fullmatch(r'(?:type\s+)?CharacterId', p)]
                  if not char_parts:
                      return match.group(0)
                  if len(char_parts) != 1:
                      raise SystemExit(f'{path}: expected one CharacterId specifier, found {len(char_parts)}')

                  remaining = [p for p in parts if p not in char_parts]
                  source = match.group('source')
                  quote = match.group('quote')
                  registry_source = source[:-len('gameEngine')] + 'characterRegistry'

                  registry_re = re.compile(
                      r"import\s+(?:type\s+)?\{[^}]*\bCharacterId\b[^}]*\}\s+from\s+['\"]"
                      + re.escape(registry_source)
                      + r"['\"];",
                      re.DOTALL,
                  )
                  already_has_registry_import = bool(registry_re.search(text))

                  chunks = []
                  if remaining:
                      prefix = 'import type' if match.group('type_only') else 'import'
                      chunks.append(f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};")
                  if not already_has_registry_import:
                      chunks.append(f"import type {{ CharacterId }} from {quote}{registry_source}{quote};")

                  nonlocal_state['moved'] += 1
                  return '\n'.join(chunks)

              next_text = import_re.sub(repl, text)
              if next_text != text:
                  path.write_text(next_text, encoding='utf-8')
                  return nonlocal_state['moved']
              return 0

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file():
                  continue
              count = transform_file(path)
              if count:
                  moved += count
                  changed_files.append(str(path))

          if moved == 0:
              raise SystemExit('no CharacterId imports through gameEngine found; refusing empty migration')

          leftovers = []
          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for match in import_re.finditer(text):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  if any(re.fullmatch(r'(?:type\s+)?CharacterId', p) for p in parts):
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit('CharacterId still imported through gameEngine in: ' + ', '.join(sorted(set(leftovers))))

          print(f'Moved {moved} CharacterId import(s) across {len(changed_files)} file(s):')
          for path in changed_files:
              print(f' - {path}')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app; then
            echo "No source diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: enforce CharacterId registry import boundary"
          git push origin HEAD:overhaul/character-import-boundary
