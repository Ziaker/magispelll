name: Temporary monster activation rule migration

on:
  push:
    branches: [overhaul/monster-activation-rule]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/monster-activation-rule
      - name: Install dependencies
        run: npm ci
      - name: Move monster activation rule
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const enginePath = 'src/app/lib/gameEngine.ts';
          const lifecyclePath = 'src/app/lib/monsterLifecycle.ts';
          const functionName = 'canActivateMonsterEffect';
          const source = fs.readFileSync(enginePath, 'utf8');
          let lifecycle = fs.readFileSync(lifecyclePath, 'utf8');

          const sf = ts.createSourceFile(enginePath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const node = sf.statements.find((stmt) => ts.isFunctionDeclaration(stmt) && stmt.name?.text === functionName);
          if (!node) throw new Error(`${functionName} not found`);
          const block = source.slice(node.getFullStart(), node.end).trim();
          if (!block.includes(`export function ${functionName}`)) throw new Error(`${functionName} is not exported as expected`);

          let next = source.slice(0, node.getFullStart()) + source.slice(node.end);

          const oldImport = "import { MAX_MONSTER_USES, resolveMonsterCardAtTurnEnd } from './monsterLifecycle';";
          const newImport = "import { MAX_MONSTER_USES, resolveMonsterCardAtTurnEnd, canActivateMonsterEffect } from './monsterLifecycle';";
          if (next.split(oldImport).length !== 2) throw new Error('monsterLifecycle import anchor not found exactly once');
          next = next.replace(oldImport, newImport);

          const oldExport = "export { MAX_MONSTER_USES } from './monsterLifecycle';";
          const newExport = "export { MAX_MONSTER_USES, canActivateMonsterEffect } from './monsterLifecycle';";
          if (next.split(oldExport).length !== 2) throw new Error('monsterLifecycle export anchor not found exactly once');
          next = next.replace(oldExport, newExport);

          const cardImport = "import type { Card } from './cardUtils';\n";
          const extraImports = "import type { PlayerNumber } from './gameTypes';\nimport type { GameState } from './gameStateTypes';\nimport { playerKeyOf } from './gameSelectors';\n";
          if (lifecycle.split(cardImport).length !== 2) throw new Error('monster lifecycle Card import anchor not found exactly once');
          lifecycle = lifecycle.replace(cardImport, cardImport + extraImports);
          lifecycle = lifecycle.trimEnd() + '\n\n' + block + '\n';

          fs.writeFileSync(enginePath, next);
          fs.writeFileSync(lifecyclePath, lifecycle);
          NODE
      - name: Migrate application imports and boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGET = 'canActivateMonsterEffect'
          import_re = re.compile(
              r"import\s+(?P<type_only>type\s+)?\{(?P<body>[^}]*)\}\s+from\s+(?P<quote>['\"])(?P<source>[^'\"]*gameEngine)(?P=quote);",
              re.DOTALL,
          )
          moved = []

          for path in sorted(Path('src/app').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or not path.is_file() or path.name in {'gameEngine.ts', 'monsterLifecycle.ts'}:
                  continue
              text = path.read_text(encoding='utf-8')
              pending = []
              target_source = [None]

              def repl(match):
                  parts = [p.strip() for p in match.group('body').split(',') if p.strip()]
                  remaining = []
                  changed = False
                  source = match.group('source')
                  candidate = source[:-len('gameEngine')] + 'monsterLifecycle'
                  for part in parts:
                      base = re.sub(r'^type\s+', '', part).strip()
                      imported_name = re.split(r'\s+as\s+', base)[0].strip()
                      if imported_name == TARGET:
                          target_source[0] = candidate
                          pending.append(base)
                          changed = True
                      else:
                          remaining.append(part)
                  if not changed:
                      return match.group(0)
                  if not remaining:
                      return ''
                  prefix = 'import type' if match.group('type_only') else 'import'
                  quote = match.group('quote')
                  return f"{prefix} {{ {', '.join(remaining)} }} from {quote}{source}{quote};"

              next_text = import_re.sub(repl, text)
              if not pending:
                  continue
              target = target_source[0]
              existing_re = re.compile(
                  r"import\s+\{(?P<body>[^}]*)\}\s+from\s+['\"]" + re.escape(target) + r"['\"];",
                  re.DOTALL,
              )
              existing = existing_re.search(next_text)
              if existing:
                  parts = [p.strip() for p in existing.group('body').split(',') if p.strip()]
                  if TARGET not in parts:
                      parts.append(TARGET)
                  replacement = f"import {{ {', '.join(parts)} }} from '{target}';"
                  next_text = next_text[:existing.start()] + replacement + next_text[existing.end():]
              else:
                  first_import = re.search(r'^import\s', next_text, re.MULTILINE)
                  if not first_import:
                      raise SystemExit(f'{path}: no import insertion point')
                  next_text = next_text[:first_import.start()] + f"import {{ {TARGET} }} from '{target}';\n" + next_text[first_import.start():]
              path.write_text(next_text, encoding='utf-8')
              moved.append(str(path))

          if not moved:
              raise SystemExit('no canActivateMonsterEffect imports found through gameEngine')
          print(f'Moved canActivateMonsterEffect across {len(moved)} file(s): {moved}')

          boundary = Path('scripts/import-boundaries-test.ts')
          text = boundary.read_text(encoding='utf-8')
          old_doc = " * - MAX_MONSTER_USES -> monsterLifecycle.ts\n"
          new_doc = " * - MAX_MONSTER_USES/canActivateMonsterEffect -> monsterLifecycle.ts\n"
          if text.count(old_doc) != 1:
              raise SystemExit('monster boundary documentation anchor not found exactly once')
          text = text.replace(old_doc, new_doc, 1)
          array_anchor = "  'MAX_MONSTER_USES',\n"
          if text.count(array_anchor) != 1:
              raise SystemExit('monster boundary symbol anchor not found exactly once')
          text = text.replace(array_anchor, array_anchor + "  'canActivateMonsterEffect',\n", 1)
          boundary.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          npm run typecheck
          npm test
          npm run test:exhaustiveness
          npm run test:actions
          npm run test:characters
          npm run test:boundaries
      - name: Commit migration
        run: |
          if git diff --quiet -- src/app scripts/import-boundaries-test.ts; then
            echo "No monster activation diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/import-boundaries-test.ts
          git commit -m "refactor: move monster activation rule to lifecycle"
          git push origin HEAD:overhaul/monster-activation-rule
